name: Family Assist
version: "0.6.3"
slug: family_assist
description: Family chat assistant backed by Ollama, driven by a git repository
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:human-male-female-child
panel_title: Family Assist
panel_admin: false
options:
  ollama_url: "http://homeassistant.local:11434"
  default_model: "qwen3:8b"
  num_ctx: 16384
  sync_interval_minutes: 60
  queue_enabled: true
  max_parallel_generations: 1
  max_tool_calls_per_turn: 25
  max_tool_result_kb: 32
schema:
  ollama_url: url
  ollama_api_key: password?
  default_model: str
  vision_model: str?
  num_ctx: int(2048,131072)
  sync_interval_minutes: int(0,1440)
  queue_enabled: bool
  max_parallel_generations: int(1,4)
  max_tool_calls_per_turn: int(1,100)
  max_tool_result_kb: int(1,256)
