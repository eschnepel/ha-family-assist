configuration:
  ollama_url:
    name: Ollama URL
    description: Base URL of the Ollama server, for example http://192.168.1.20:11434
  ollama_api_key:
    name: Ollama API key
    description: Optional. Sent as a bearer token to Ollama only.
  default_model:
    name: Default model
    description: Must support tool calling.
  vision_model:
    name: Vision model
    description: Optional model used when a message contains photos.
  num_ctx:
    name: Context size
    description: Context window (tokens) requested from Ollama.
  sync_interval_minutes:
    name: Sync interval (minutes)
    description: Periodic pull of the Agent Environment; 0 disables.
  queue_enabled:
    name: Generation queue
    description: Queue generations (FIFO). When off, requests go straight to Ollama.
  max_parallel_generations:
    name: Parallel generations
    description: How many generations may run at once when the queue is enabled.
  max_tool_calls_per_turn:
    name: Tool calls per turn
    description: Upper limit of tool calls in one assistant turn.
  max_tool_result_kb:
    name: Tool result size (KB)
    description: Upper limit for the result of one tool call.

prompts:
  system: |-
    You are running inside Family Assist, a chat assistant for a family.
    Current user: {alias}
    Today: {today}

    You can only use the tools provided to you to work with the files of your environment. Paths are relative to the environment root and use forward slashes. Some files may not exist for you; do not try to work around that. Never reveal or guess secrets, keys or tokens.
    {write_note}
    Follow the instructions below.
  write_note_enabled: You may create and change files; changes are saved automatically after your reply.
  write_note_disabled: You cannot change files.
  acting_note: The admin {admin} is typing on behalf of {alias}. Treat {alias} as the current user, not {admin}.
  chat_title: |-
    Give a meaningful name for this chat in the format "[Context]: [descriptive word group]". Reply with the name only, at most 60 characters.

    First message:
    {text}
