configuration:
  ollama_url:
    name: Ollama-URL
    description: Basis-URL des Ollama-Servers, zum Beispiel http://192.168.1.20:11434
  ollama_api_key:
    name: Ollama-API-Schlüssel
    description: Optional. Wird nur als Bearer-Token an Ollama gesendet.
  default_model:
    name: Standardmodell
    description: Muss Werkzeugaufrufe (Tool Calling) unterstützen.
  vision_model:
    name: Bildmodell
    description: Optionales Modell für Nachrichten mit Fotos.
  num_ctx:
    name: Kontextgröße
    description: Kontextfenster (Token), das bei Ollama angefordert wird.
  sync_interval_minutes:
    name: Synchronisationsintervall (Minuten)
    description: Regelmäßiges Aktualisieren der Agent-Umgebung; 0 deaktiviert es.
  queue_enabled:
    name: Warteschlange für Antworten
    description: Antworten der Reihe nach (FIFO) erzeugen. Ausgeschaltet gehen Anfragen direkt an Ollama.
  max_parallel_generations:
    name: Parallele Antworten
    description: Wie viele Antworten gleichzeitig laufen dürfen, wenn die Warteschlange aktiv ist.
  max_tool_calls_per_turn:
    name: Werkzeugaufrufe pro Durchgang
    description: Obergrenze für Werkzeugaufrufe in einem Durchgang des Assistenten.
  max_tool_result_kb:
    name: Größe des Werkzeugergebnisses (KB)

prompts:
  system: |-
    Du läufst in Family Assist, einem Chat-Assistenten für eine Familie.
    Aktueller Benutzer: {alias}
    Heute: {today}

    Du kannst nur die dir bereitgestellten Werkzeuge nutzen, um mit den Dateien deiner Umgebung zu arbeiten. Pfade sind relativ zum Wurzelverzeichnis der Umgebung und verwenden Schrägstriche. Manche Dateien existieren für dich eventuell nicht; versuche nicht, das zu umgehen. Gib niemals Geheimnisse, Schlüssel oder Tokens preis und rate sie nicht.
    {write_note}
    Befolge die folgenden Anweisungen.
  write_note_enabled: Du darfst Dateien erstellen und ändern; Änderungen werden nach deiner Antwort automatisch gespeichert.
  write_note_disabled: Du kannst keine Dateien ändern.
  acting_note: Der Admin {admin} schreibt im Namen von {alias}. Behandle {alias} als aktuellen Benutzer, nicht {admin}.
  chat_title: |-
    Gib diesem Chat einen aussagekräftigen Namen im Format "[Kontext]: [beschreibende Wortgruppe]". Antworte nur mit dem Namen, höchstens 60 Zeichen.

    Erste Nachricht:
    {text}
